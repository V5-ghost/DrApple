  <div class="sd" style="margin-top:8px">The store reviews every request first. Approved refunds go back to the account you paid from.</div>
  <button class="btn" onclick="sendRefund('${o.id}')">Submit request</button>`)}
async function sendRefund(oid){const o=O.find(x=>x.id===oid),ch=[...document.querySelectorAll('#sh .rfc:checked')].map(c=>o.items[+c.dataset.i]),reason=$('#rfr').value,details=$('#rft').value.trim();
  if(!ch.length)return toast('Select at least one product');if(!reason)return toast('Choose a reason');if(details.length<5)return toast('Please describe what happened');
  const ratio=o.subtotal?(o.subtotal-(o.discount||0))/o.subtotal:1,amount=Math.round(ch.reduce((s,i)=>s+i.price*i.qty,0)*ratio),id='RF'+Date.now().toString(36).toUpperCase();
  await DB.set('refunds',id,{id,orderId:oid,customer:o.customer,items:ch.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.price,opts:i.opts||''})),amount,reason,details,status:'pending',createdAt:Date.now()});
  const rq={id,orderId:oid,customer:o.customer,items:ch.map(i=>({name:i.name,qty:i.qty,opts:i.opts||'',price:i.price})),amount,reason,details};
  notify(NK(o.customer),MSG.refReq(rq),{orderId:oid,refundId:id});notify('admin',MSG.adminRef(rq),{orderId:oid,refundId:id});
  closeSh();toast('Refund request sent ✓')}

function acc(){
  if(view!=='acc'||/INPUT|TEXTAREA/.test(document.activeElement?.tagName||'')&&document.activeElement.closest('#v-acc'))return;
  const mine=O.filter(o=>(prof.email&&o.customer?.email===prof.email)||(prof.phone&&o.customer?.phone===prof.phone)).sort((a,b)=>b.createdAt-a.createdAt);
  $('#v-acc').innerHTML=`<h3>My account</h3><input class="f" id="an" placeholder="Full name" value="${esc(prof.name)}"><input class="f" id="ae" type="email" placeholder="Email" value="${esc(prof.email)}"><input class="f" id="ap" type="tel" placeholder="Phone" value="${esc(prof.phone)}"><textarea class="f" id="aa" rows="2" placeholder="Delivery address">${esc(prof.address)}</textarea>
  <button class="btn" onclick="saveProf()">Save details</button>
  <h3 style="margin-top:24px">My orders</h3><div class="sd">Tap an order to see the receipt or request a refund.</div>${mine.map(o=>{const r=RF.filter(x=>x.orderId===o.id&&x.status==='pending').length;return `<div class="row" style="cursor:pointer" onclick="rc(O.find(x=>x.id==='${o.id}'),1)"><div style="min-width:0"><b>${esc(o.id)}</b><div class="sd">${o.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</div></div><div style="text-align:right"><b>${fmt(o.total)}</b><div class="sd">${esc((o.deliveryStatus||'').replace(/_/g,' '))}${r?' · refund pending':''}</div></div></div>`}).join('')||'<div class="empty" style="padding:30px 0">No orders yet.</div>'}
  <div class="sd" style="text-align:center;margin-top:14px">${CFG.projectId?'':'Test mode: data stays in this browser'}</div>`}
function saveProf(){prof={...prof,name:$('#an').value.trim(),email:$('#ae').value.trim(),phone:$('#ap').value.trim(),address:$('#aa').value.trim()};sv('prof',prof);badge();toast('Saved ✓');document.activeElement.blur();acc()}
function theme(){const r=document.documentElement,d=r.dataset.t?r.dataset.t==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.t=d?'light':'dark';localStorage.setItem('t',r.dataset.t);const b=document.querySelector('#tg');if(b){b.classList.remove('spin');void b.offsetWidth;b.classList.add('spin')}}
function go(v){view=v;['home','cart','al','acc'].forEach(x=>{$('#v-'+x).classList.toggle('on',x===v);$('#n-'+x).classList.toggle('on',x===v)});
  $('#hd').style.display=v==='home'?'block':'none';scrollTo(0,0);if(v==='cart')renderCart();if(v==='acc')acc();if(v==='al')renderAl()}
</script>
</body></html>
